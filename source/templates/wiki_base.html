{% extends "base.html" %}
{% block sub %}
<div class="wiki-top">
  <div class="wrap">
    {% for it in (snav or site.wiki_menu) %}<a href="{{ it.href }}"{% if wsec == it.key %} aria-current="page"{% endif %}>{{ it.title }}</a>{% endfor %}
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="q" type="search" placeholder="{{ splace or 'Предмет, монстр, умение…' }}" data-index="{{ sindex or '/static/search.json' }}" autocomplete="off" aria-label="Поиск по базе">
      <kbd aria-hidden="true">/</kbd>
      <div class="search-res" id="qres"></div>
    </div>
  </div>
</div>
{% endblock %}
